<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #8a8f98;
    --border: #e3e5e8;
    --accent: #3b82f6;
    --danger: #ef4444;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card: #1f2229;
      --text: #e8eaed;
      --muted: #8a8f98;
      --border: #2e323b;
      --accent: #60a5fa;
      --danger: #f87171;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  #count {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  form {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  #input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }

  #input:focus { border-color: var(--accent); }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  #add {
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 550;
    color: #fff;
    background: var(--accent);
    border-radius: 8px;
  }

  #add:disabled {
    opacity: 0.4;
    cursor: default;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }

  li:last-child { border-bottom: none; }

  li input[type="checkbox"] {
    flex: none;
    width: 19px;
    height: 19px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    overflow-wrap: anywhere;
  }

  li.done .name {
    color: var(--muted);
    text-decoration: line-through;
  }

  .delete {
    flex: none;
    padding: 4px 8px;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
    border-radius: 6px;
  }

  .delete:hover {
    color: var(--danger);
    background: var(--bg);
  }

  #empty {
    padding: 40px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }

  #status {
    margin: 0;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--danger);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  footer {
    display: flex;
    justify-content: flex-end;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
  }

  #clear {
    font-size: 13px;
    color: var(--muted);
  }

  #clear:hover { color: var(--danger); }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>쇼핑 리스트</h1>
    <p id="count"></p>
  </header>

  <p id="status" role="status" hidden></p>

  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="살 물건을 입력하세요" maxlength="100" required>
    <button id="add" type="submit">추가</button>
  </form>

  <ul id="list"></ul>
  <p id="empty">아직 담은 물건이 없습니다.</p>

  <footer hidden id="footer">
    <button id="clear" type="button">체크한 항목 지우기</button>
  </footer>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // 공개 키(publishable key)는 브라우저에 노출되는 것이 정상이다.
  // 실제 접근 통제는 shopping_items 테이블의 RLS 정책이 담당한다.
  const SUPABASE_URL = 'https://hniauzdsgbptkhmgqjkq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_pDO7zZWm2OOkdSx0YvPWVw_X5Lb2oqF';
  const TABLE = 'shopping_items';

  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const addBtn = document.getElementById('add');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const footer = document.getElementById('footer');
  const clearBtn = document.getElementById('clear');
  const count = document.getElementById('count');
  const status = document.getElementById('status');

  let items = [];
  let loading = true;

  function fail(message, error) {
    console.error(message, error);
    status.textContent = message;
    status.hidden = false;
  }

  function clearStatus() {
    status.textContent = '';
    status.hidden = true;
  }

  // 서버를 유일한 진실로 삼는다. 쓰기 후에는 실시간 이벤트가 이 함수를 다시 부른다.
  async function refresh() {
    const { data, error } = await db
      .from(TABLE)
      .select('id, name, done')
      .order('created_at');

    if (error) {
      fail('목록을 불러오지 못했습니다. 연결을 확인해 주세요.', error);
      return;
    }

    items = data;
    loading = false;
    clearStatus();
    render();
  }

  function render() {
    list.textContent = '';

    for (const item of items) {
      const li = document.createElement('li');
      li.className = item.done ? 'done' : '';

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = item.done;
      check.addEventListener('change', () => toggle(item.id));

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;

      const del = document.createElement('button');
      del.className = 'delete';
      del.type = 'button';
      del.textContent = '×';
      del.title = '삭제';
      del.setAttribute('aria-label', item.name + ' 삭제');
      del.addEventListener('click', () => remove(item.id));

      li.append(check, name, del);
      list.append(li);
    }

    const done = items.filter(it => it.done).length;
    empty.textContent = loading ? '불러오는 중…' : '아직 담은 물건이 없습니다.';
    empty.hidden = items.length > 0;
    footer.hidden = done === 0;
    count.textContent = items.length ? `${items.length}개 중 ${done}개 완료` : '';
  }

  // 아래 세 함수는 화면을 먼저 바꾸고 서버에 반영한다(낙관적 갱신).
  // 서버가 거부하면 이전 상태로 되돌리고 이유를 보여 준다.
  async function add(name) {
    const { data, error } = await db
      .from(TABLE)
      .insert({ name })
      .select('id, name, done')
      .single();

    if (error) {
      fail('항목을 추가하지 못했습니다.', error);
      return;
    }

    items.push(data);
    clearStatus();
    render();
  }

  async function toggle(id) {
    const item = items.find(it => it.id === id);
    if (!item) return;

    const next = !item.done;
    item.done = next;
    render();

    const { error } = await db.from(TABLE).update({ done: next }).eq('id', id);
    if (error) {
      item.done = !next;
      render();
      fail('체크 상태를 저장하지 못했습니다.', error);
    }
  }

  async function remove(id) {
    const before = items;
    items = items.filter(it => it.id !== id);
    render();

    const { error } = await db.from(TABLE).delete().eq('id', id);
    if (error) {
      items = before;
      render();
      fail('항목을 삭제하지 못했습니다.', error);
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    input.value = '';
    addBtn.disabled = true;
    input.focus();
    add(name);
  });

  input.addEventListener('input', () => {
    addBtn.disabled = input.value.trim() === '';
  });

  clearBtn.addEventListener('click', async () => {
    const doneIds = items.filter(it => it.done).map(it => it.id);
    if (!doneIds.length) return;

    const before = items;
    items = items.filter(it => !it.done);
    render();

    const { error } = await db.from(TABLE).delete().in('id', doneIds);
    if (error) {
      items = before;
      render();
      fail('체크한 항목을 지우지 못했습니다.', error);
    }
  });

  // 다른 탭이나 다른 기기에서 목록이 바뀌면 실시간으로 받아 다시 그린다.
  // 자기 자신이 일으킨 변경에도 이벤트가 오지만, refresh()는 여러 번 불려도 안전하다.
  db.channel('shopping-items')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, refresh)
    .subscribe();

  addBtn.disabled = true;
  render();
  input.focus();
  refresh();
</script>

</body>
</html>
